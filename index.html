  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Space Mono', monospace;
      color: #2a2a2e;
      cursor: crosshair;
    }

    #blackout {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10;
      transition: opacity 0.6s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #blackout.off {
      opacity: 0;
      pointer-events: none;
    }

    #blackout img {
      width: 200px;
      image-rendering: pixelated;
    }

    canvas { display: block; }


    /* Bottom center info */
    .info {
      position: fixed;
      bottom: 6rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
    }

    .info h1 {
      font-family: 'Libre Baskerville', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }

    .info .tagline {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.04em;
    }

    .info .links {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .info .links a {
      color: #666;
      transition: color 0.3s;
    }

    .info .links a:hover {
      color: #fff;
    }

    .info .hint {
      margin-top: 0.8rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: #555;
      text-transform: uppercase;
      animation: hintPulse 3s ease-in-out infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 768px) {
      .info {
        bottom: 3rem;
        width: 90%;
      }

      .info h1 {
        font-size: 1.4rem;
      }

      .info .tagline {
        font-size: 0.6rem;
      }

      .info .links {
        margin-top: 0.7rem;
        gap: 1.2rem;
      }

      .info .hint {
        font-size: 0.5rem;
      }
    }

  </style>

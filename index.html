<body id="home">

    <main class="landing">
        <img id="penguin" src="penguin-with-bg.png" alt="Juan Vargas" class="profile-image">

    <footer class="contact-section">

    </footer>

    <canvas id="penguinCanvas"></canvas>

    <script>
        const penguin = document.getElementById('penguin');
        const canvas = document.getElementById('penguinCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        // Debounce resize handler
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 150);
        });

        // Preload penguin image
        const penguinImg = new Image();
        penguinImg.src = 'penguin.svg';

        // Penguin particles array
        let fallingPenguins = [];

        // Gravity constants
        const gravityX = 0;
        const gravityY = 400;

        // Penguin jump animation
        penguin.addEventListener('mouseenter', () => {
            penguin.classList.add('jumping');
        });

        penguin.addEventListener('animationend', () => {
            penguin.classList.remove('jumping');
        });

        // Spawn queue for time-based penguin creation
        let spawnQueue = [];
        let nextAvailableSpawnTime = 0;

        function createPenguin() {
            return {
                x: Math.random() * canvas.width,
                y: -100,
                rotation: 0,
                velocityY: 200 + Math.random() * 100,
                velocityX: 0,
                rotationSpeed: 90 + Math.random() * 180,
                opacity: 1,
                age: 0,
                bounceCount: 0,
                maxBounces: 3 + Math.floor(Math.random() * 3),
                restitution: 0.3 + Math.random() * 0.2,
                fallingOut: false
            };
        }

        // Create falling penguins on click/touch
        function spawnPenguinRain(e) {
            e.preventDefault(); // Prevent default touch behavior

            const count = 100;
            const spawnDuration = 3; // spawn over 3 seconds
            const delay = spawnDuration / count;

            // Queue penguins starting from the next available spawn time
            const currentTime = performance.now() / 1000;
            const startTime = Math.max(currentTime, nextAvailableSpawnTime);

            for (let i = 0; i < count; i++) {
                spawnQueue.push({
                    spawnTime: startTime + (i * delay),
                    penguin: createPenguin()
                });
            }

            // Update next available spawn time so clicks don't overlap
            nextAvailableSpawnTime = startTime + spawnDuration;

            // Start animation loop if not already running
            startAnimation();
        }

        penguin.addEventListener('click', spawnPenguinRain);
        penguin.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent synthetic click and double-fire
            spawnPenguinRain(e);
        });

        // Animation loop
        let lastTime = performance.now();
        let animationFrameId = null;

        function animate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000; // convert to seconds
            lastTime = currentTime;
            const currentTimeSeconds = currentTime / 1000;

            // Process spawn queue
            while (spawnQueue.length > 0 && spawnQueue[0].spawnTime <= currentTimeSeconds) {
                fallingPenguins.push(spawnQueue.shift().penguin);
            }

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Set composite operation once for all penguins
            ctx.globalCompositeOperation = 'screen';

            // Update and draw penguins
            fallingPenguins = fallingPenguins.filter(p => {
                // Update age
                p.age += deltaTime;

                // Only animate if age is positive (handles stagger)
                if (p.age < 0) return true;

                // Apply gravity in both directions
                p.velocityY += gravityY * deltaTime;
                p.velocityX += gravityX * deltaTime;

                // Update position and rotation
                p.y += p.velocityY * deltaTime;
                p.x += p.velocityX * deltaTime;
                p.rotation += p.rotationSpeed * deltaTime;

                // Bounce physics at bottom
                if (!p.fallingOut && p.y >= canvas.height - 20) {
                    p.y = canvas.height - 20;
                    p.bounceCount++;

                    // Check if reached max bounces
                    if (p.bounceCount >= p.maxBounces) {
                        p.fallingOut = true;
                        p.velocityY = 200; // fall through the screen
                        p.velocityX += (Math.random() - 0.5) * 100;
                    } else {
                        p.velocityY = -p.velocityY * p.restitution; // reverse and reduce velocity
                        p.velocityX += (Math.random() - 0.5) * 200; // random horizontal velocity -100 to 100
                    }
                }

                // Bounce physics at sides
                if (p.x < 20) {
                    p.x = 20;
                    p.velocityX = Math.abs(p.velocityX) * 0.5; // bounce back with dampening
                } else if (p.x > canvas.width - 20) {
                    p.x = canvas.width - 20;
                    p.velocityX = -Math.abs(p.velocityX) * 0.5; // bounce back with dampening
                }

                // Remove if fell off screen
                if (p.fallingOut && p.y > canvas.height + 100) {
                    return false;
                }

                // Draw penguin
                ctx.save();
                ctx.globalAlpha = p.opacity;

                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);

                // Draw at consistent size
                ctx.drawImage(penguinImg, -20, -20, 40, 40);
                ctx.restore();

                return true;
            });

            // Only continue animation if there are particles to render
            if (fallingPenguins.length > 0) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                animationFrameId = null;
            }
        }

        function startAnimation() {
            if (animationFrameId === null) {
                lastTime = performance.now();
                animationFrameId = requestAnimationFrame(animate);
            }
        }

        // Image is preloaded and ready to use when clicked
    </script>

</body>

</html>

; vy = -vy * restitution; vx += (Math.random() - 0.5) * 100; bounces++; } frames.push({ x, y, rotation }); } return frames; } function spawnPenguinRain(e) { e.preventDefault(); if (isAnimating) return; isAnimating = true; trajectories = []; const count = 80; for (let i = 0; i < count; i++) { const startX = Math.random() * canvas.width; const delay = (i / count) * 2; // stagger over 2 seconds trajectories.push(precalculateTrajectory(startX, delay)); } let frame = 0; function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.globalCompositeOperation = 'screen'; let activeCount = 0; for (const traj of trajectories) { const pos = traj[frame]; if (pos) { ctx.save(); ctx.translate(pos.x, pos.y); ctx.rotate(pos.rotation * Math.PI / 180); ctx.drawImage(penguinImg, -20, -20, 40, 40); ctx.restore(); activeCount++; } else if (frame < traj.length) { activeCount++; } } frame++; if (activeCount > 0) { requestAnimationFrame(animate); } else { isAnimating = false; } } requestAnimationFrame(animate); } penguin.addEventListener('mouseenter', () => penguin.classList.add('jumping')); penguin.addEventListener('animationend', () => penguin.classList.remove('jumping')); penguin.addEventListener('click', spawnPenguinRain); penguin.addEventListener('touchstart', spawnPenguinRain, { passive: false }); </script></body></html>

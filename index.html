<body id="home">

    <canvas id="penguinCanvas"></canvas>

    <script>
        const penguin = document.getElementById('penguin');
        const canvas = document.getElementById('penguinCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const penguinImg = new Image();
        penguinImg.src = 'penguin.svg';

        let isAnimating = false;
        let trajectories = [];

        // Precalculate trajectory for one penguin (simple fall + bounce)
        function precalculateTrajectory(startX, startDelay) {
            const frames = [];
            const fps = 60;
            const dt = 1 / fps;
            const gravity = 200;
            const groundY = canvas.height - 20;

            let x = startX;
            let y = -40;
            let vx = (Math.random() - 0.5) * 50;
            let vy = 100 + Math.random() * 50;
            let rotation = 0;
            let rotationSpeed = 90 + Math.random() * 180;
            let bounces = 0;
            const maxBounces = 2 + Math.floor(Math.random() * 2);
            const restitution = 0.4;

            // Add delay frames
            for (let i = 0; i < startDelay * fps; i++) {
                frames.push(null);
            }

            // Simulate until off screen
            while (y < canvas.height + 100) {
                vy += gravity * dt;
                y += vy * dt;
                x += vx * dt;
                rotation += rotationSpeed * dt;

                if (y >= groundY && bounces < maxBounces) {
                    y = groundY;
                    vy = -vy * restitution;
                    vx += (Math.random() - 0.5) * 100;
                    bounces++;
                }

                frames.push({ x, y, rotation });
            }

            return frames;
        }

        function spawnPenguinRain(e) {
            e.preventDefault();
            if (isAnimating) return;

            isAnimating = true;
            trajectories = [];

            const count = 80;
            for (let i = 0; i < count; i++) {
                const startX = Math.random() * canvas.width;
                const delay = (i / count) * 2; // stagger over 2 seconds
                trajectories.push(precalculateTrajectory(startX, delay));
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'screen';

                let activeCount = 0;
                for (const traj of trajectories) {
                    const pos = traj[frame];
                    if (pos) {
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(pos.rotation * Math.PI / 180);
                        ctx.drawImage(penguinImg, -20, -20, 40, 40);
                        ctx.restore();
                        activeCount++;
                    } else if (frame < traj.length) {
                        activeCount++;
                    }
                }

                frame++;
                if (activeCount > 0) {
                    requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                }
            }

            requestAnimationFrame(animate);
        }

        penguin.addEventListener('mouseenter', () => penguin.classList.add('jumping'));
        penguin.addEventListener('animationend', () => penguin.classList.remove('jumping'));
        penguin.addEventListener('click', spawnPenguinRain);
        penguin.addEventListener('touchstart', spawnPenguinRain, { passive: false });
    </script>

</body>
